spring.application.name=smart-ats-score-tracker

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smart-ats-tracker}
spring.data.mongodb.auto-index-creation=true

server.port=${SERVER_PORT:8080}

# JWT (set JWT_SECRET in production)
app.jwt.secret=${JWT_SECRET:dev-only-change-me-use-long-random-secret-in-production}
app.jwt.expiration-ms=86400000

# Auth rate limiting
app.auth.rate-limit.max-requests=20
app.auth.rate-limit.window-seconds=60

# Resume upload (ATS)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.ats.max-resume-size-bytes=5242880

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
